# AcePass CI: the checks that must pass before a change is considered done.
#
# PostgreSQL is a real service here: the consistency and constraint tests must
# never fall back to SQLite. Every browser job runs against its own database,
# Redis, media directory and ports, and against a real Worker (never inline
# consumers), because "the UI looked right" is not evidence that the async chain
# works.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # A dedicated CI database name: the pytest run creates `test_<name>`,
          # and no CI step may point at the name a developer's database uses.
          POSTGRES_DB: acepass_ci
          POSTGRES_USER: acepass
          POSTGRES_PASSWORD: acepass_dev_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acepass" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      ACEPASS_RUNTIME_MODE: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: acepass_ci
      POSTGRES_USER: acepass
      POSTGRES_PASSWORD: acepass_dev_pw
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements/lock.txt -r requirements/dev.txt
      - name: Lint
        working-directory: backend
        run: .venv/bin/ruff check apps ai domain config tests
      - name: Django checks (dev and production)
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-long-random-secret-key-value-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: acepass.example.com,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://acepass.example.com
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.dev .venv/bin/python manage.py check
          # 生产设置以 production 模式运行（没有默认密钥、默认主机与默认调试模式）。
          # 不加 `|| true`：配置错误必须让这一步失败，发布门槛不能被吞掉。
          # --fail-level WARNING 让任何未经审阅的部署告警也失败；已知且明确接受的
          # security.W021（HSTS preload，需域名所有者决定）在 prod.py 中显式静音。
          ACEPASS_RUNTIME_MODE=production DJANGO_SETTINGS_MODULE=config.settings.prod \
            .venv/bin/python manage.py check --deploy --fail-level WARNING
      - name: Migrations are complete and reversible
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-long-random-secret-key-value-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.dev .venv/bin/python manage.py makemigrations --check --dry-run
      - name: Tests (real PostgreSQL)
        working-directory: backend
        run: .venv/bin/python -m pytest tests -q

  infra:
    # 发布门槛的部署侧校验：Compose 变量/YAML 合并、nginx 模板渲染、明文入口 301 的
    # 目标端口、真实前端产物与上游解析、真实全栈登录，以及 shell 语法。
    #
    # 两个代理检查**分开执行、分开命名**，任何一个都不冒充另一个：
    #   * Proxy component check —— nginx 容器 + 真实 frontend/dist + 占 8000 端口的
    #     桩上游；证明跳转目标、TLS 终止、登录页面产物与 `upstream ... server api:8000`
    #     能被解析。**不证明** AcePass API/数据库/会话可用。
    #   * Full-stack login check —— docker compose 构建真实应用镜像，起真实
    #     postgres/redis/api/web，执行真实迁移并创建一个真实账户，然后经 HTTPS 代理
    #     完成一次带 CSRF 的真实登录。组件检查通过不等于这一步通过。
    #
    # 这两个步骤尚未在 GitHub Actions 上实际执行过：本轮只在本地用同样的脚本验证，
    # CI 上的实际执行状态保持未验证，不得据此声称发布门槛已由 CI 通过。
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acepass-frontend-dist
          path: frontend/dist
      - name: The committed tree carries a template, never a real configuration
        # 干净 checkout 必须自带模板：脚本与 CI 都不再依赖未提交的本地文件（C05）。
        run: |
          test -f infra/docker/.env.example || { echo "缺少已提交的 infra/docker/.env.example"; exit 1; }
          if git ls-files --error-unmatch infra/docker/.env >/dev/null 2>&1; then
            echo "infra/docker/.env 是本地配置，不得进入版本库"; exit 1
          fi
          grep -q 'change-me' infra/docker/.env.example || { echo "模板必须是不含真实密钥的示例"; exit 1; }
      - name: Compose config validation
        # 直接以模板作为 env file 校验，不写出 infra/docker/.env：验证步骤也不该
        # 覆盖或创建本地配置。
        run: docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env.example config --quiet
      - name: Generate throwaway TLS certs
        # 证书只生成到 runner 的临时目录；仓库树内不留任何私钥（infra/docker/certs 已忽略）。
        run: bash scripts/gen-dev-certs.sh "${RUNNER_TEMP}/acepass-ci-certs" localhost
      - name: Render and validate the nginx template
        # 与生产完全相同的路径：nginx 镜像的入口脚本用 envsubst 渲染
        # /etc/nginx/templates/default.conf.template，再执行 nginx -t。
        run: |
          docker run --rm --add-host api:127.0.0.1 \
            -e ACEPASS_HTTPS_PORT=8443 \
            -v "$PWD/infra/proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "${RUNNER_TEMP}/acepass-ci-certs:/etc/nginx/certs:ro" \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            nginx:1.27-alpine nginx -t
      - name: Proxy component check (redirect target, TLS, real SPA bundle, upstream)
        # 实际启动容器并发出真实请求：跳转必须落到公开的 HTTPS 端口，`api` 上游必须
        # 真的解析，/login 必须由挂载的 AcePass 产物提供且脚本资源可加载。范围仅限
        # 代理组件，API 与数据库不在本步骤内。
        # 脚本自带隔离：每次运行生成唯一项目/资源名、端口、临时 env 与证书目录，
        # 不读写 infra/docker/.env，也不删除不属于本次运行的容器或卷。
        run: bash scripts/verify_proxy.sh component
      - name: Full-stack login check (real compose stack through the proxy)
        # 与上一步分开：这里才是"全栈登录通过"。需要构建应用镜像并跑真实迁移。
        run: bash scripts/verify_proxy.sh full-stack
      - name: Compose logs on failure
        # 脚本用唯一项目名并在 EXIT 中清理自己的资源，所以这里不会留下可读的失败
        # 容器；失败诊断由脚本自身的 docker logs 输出负责。这条只列出全局状态，
        # 不做任何清理。
        if: failure()
        run: docker ps -a --format '{{.Names}}\t{{.Status}}' || true
      - name: Shell script syntax
        run: for f in scripts/*.sh; do echo "bash -n $f"; bash -n "$f"; done
      - name: Restore refuses an unreachable database (dry-run)
        # 连接失败必须非零退出；以前它被当成「目标库不存在」，dry-run 还会谎报通过。
        run: |
          set -euo pipefail
          backup="$(mktemp -d)"
          media="$(mktemp -d)/media"
          echo "not-a-dump" > "${backup}/database.dump"
          tar -czf "${backup}/media.tar.gz" -T /dev/null
          : > "${backup}/media-manifest.sha256"
          set +e
          POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=59999 POSTGRES_USER=acepass \
            bash scripts/restore.sh --dry-run "${backup}" acepass_restore_unreachable "${media}" \
            >/tmp/restore-out.txt 2>&1
          status=$?
          set -e
          cat /tmp/restore-out.txt
          test "${status}" -ne 0 || { echo "数据库不可连时 dry-run 必须失败"; exit 1; }
          grep -q "无法连接数据库" /tmp/restore-out.txt || { echo "必须明确报告连接失败"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and build
        working-directory: frontend
        run: |
          npx tsc -b
          npx vite build
      - name: Upload the built SPA
        # infra 的代理检查必须挂载**真实**产物，而不是空目录：它下载的就是这一份。
        uses: actions/upload-artifact@v4
        with:
          name: acepass-frontend-dist
          path: frontend/dist
          if-no-files-found: error

  browser-acceptance:
    # 新版浏览器验收：空账户 + 真实结构夹具，隔离数据库/Redis/媒体/端口，并且
    # 必须接真实 Worker（ACEPASS_INLINE_TASKS=false）。运行 30 条原验收场景加
    # P0.2 新增反例（照片草稿、可视填空答案）。
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acepass_acceptance_ci
          POSTGRES_USER: acepass
          POSTGRES_PASSWORD: acepass_dev_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acepass" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: acepass_acceptance_ci
      POSTGRES_USER: acepass
      POSTGRES_PASSWORD: acepass_dev_pw
      REDIS_URL: redis://127.0.0.1:6380/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
      ACEPASS_INLINE_TASKS: "false"
      ACEPASS_PRIVATE_MEDIA_ROOT: ${{ github.workspace }}/var/private-media-acceptance
      ACEPASS_BROWSER_API_PORT: "8011"
      ACEPASS_BROWSER_WEB_PORT: "5181"
      DJANGO_SECRET_KEY: ci-only-long-random-secret-key-value-0123456789abcdef
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5181,http://127.0.0.1:8011
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements/lock.txt
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the real Worker
        working-directory: backend
        run: |
          mkdir -p ../var/logs
          nohup .venv/bin/celery -A config worker --pool=solo \
            -Q ingestion,tutoring,projection -c 1 -l INFO \
            > ../var/logs/acceptance-worker.log 2>&1 &
          echo $! > ../var/logs/acceptance-worker.pid
          for _ in $(seq 1 30); do
            if grep -q "ready" ../var/logs/acceptance-worker.log 2>/dev/null; then break; fi
            sleep 1
          done
          tail -5 ../var/logs/acceptance-worker.log
      - name: Browser acceptance (isolated DB, Redis, media and ports)
        # `@stub` 用例需要显式开启 stub provider（见下一步与 playwright 配置的注释），
        # 这里必须排除它们，否则它们会以「AI 未配置」失败——那不是回归，而是跑错了批次。
        working-directory: frontend
        run: npx playwright test --config playwright.acceptance.config.ts --grep-invert "@stub"
      - name: Worker consumed every outbox event
        # 只有 processed_at 才算完成：正常路径结束后不得留下未确认事件（给在途事件
        # 一点时间，但不能把「还没好」当成「没问题」）。
        if: always()
        working-directory: backend
        run: |
          for _ in $(seq 1 30); do
            summary="$(.venv/bin/python manage.py shell -c "
          from apps.audit.services import outbox
          print(outbox.unresolved_summary())
          ")"
            echo "unresolved outbox events: ${summary}"
            case "${summary}" in
              *"{}"*) exit 0 ;;
            esac
            sleep 2
          done
          echo "仍有未确认的 outbox 事件"; exit 1
      - name: Worker log
        if: always()
        run: tail -50 var/logs/acceptance-worker.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-acceptance-report
          path: var/browser-acceptance

  browser-stub:
    # stub provider 专跑：`@stub` 用例证明界面把离线 stub 的输出明确标注为 stub、
    # 分片只发经校验的片段、重连不再调用模型。它们**必须**在
    # `ACEPASS_AI_PROVIDER=stub` 且 `ACEPASS_RUNTIME_MODE=demo`（AI_ALLOW_STUB）下运行；
    # 混在普通验收批里跑会以「AI 未配置」失败，那种失败不说明任何产品行为。
    # 与验收批分开：两者都需要空的数据库、Redis、媒体目录与端口。
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acepass_acceptance_stub_ci
          POSTGRES_USER: acepass
          POSTGRES_PASSWORD: acepass_dev_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acepass" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6382:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: acepass_acceptance_stub_ci
      POSTGRES_USER: acepass
      POSTGRES_PASSWORD: acepass_dev_pw
      REDIS_URL: redis://127.0.0.1:6382/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
      ACEPASS_INLINE_TASKS: "false"
      ACEPASS_RUNTIME_MODE: demo
      ACEPASS_AI_PROVIDER: stub
      ACEPASS_PRIVATE_MEDIA_ROOT: ${{ github.workspace }}/var/private-media-stub
      ACEPASS_BROWSER_API_PORT: "8013"
      ACEPASS_BROWSER_WEB_PORT: "5183"
      DJANGO_SECRET_KEY: ci-only-long-random-secret-key-value-0123456789abcdef
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5183,http://127.0.0.1:8013
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements/lock.txt
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the real Worker
        working-directory: backend
        run: |
          mkdir -p ../var/logs
          nohup .venv/bin/celery -A config worker --pool=solo \
            -Q ingestion,tutoring,projection -c 1 -l INFO \
            > ../var/logs/stub-worker.log 2>&1 &
          echo $! > ../var/logs/stub-worker.pid
          for _ in $(seq 1 30); do
            if grep -q "ready" ../var/logs/stub-worker.log 2>/dev/null; then break; fi
            sleep 1
          done
          tail -5 ../var/logs/stub-worker.log
      - name: Browser acceptance — stub provider batch
        working-directory: frontend
        run: npx playwright test --config playwright.acceptance.config.ts --grep "@stub"
      - name: Worker log
        if: always()
        run: tail -50 var/logs/stub-worker.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-stub-report
          path: var/browser-acceptance

  browser-original:
    # 原 16 条浏览器套件：自己的数据库、Redis、媒体目录与端口，自己的演示夹具。
    # 与验收套件分开运行，因为两者的 globalSetup 都要求一个空的媒体目录。
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acepass_browser_audit_ci
          POSTGRES_USER: acepass
          POSTGRES_PASSWORD: acepass_dev_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acepass" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6381:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: acepass_browser_audit_ci
      POSTGRES_USER: acepass
      POSTGRES_PASSWORD: acepass_dev_pw
      REDIS_URL: redis://127.0.0.1:6381/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
      ACEPASS_PRIVATE_MEDIA_ROOT: ${{ github.workspace }}/var/private-media-original
      ACEPASS_BROWSER_API_PORT: "8012"
      ACEPASS_BROWSER_WEB_PORT: "5182"
      DJANGO_SECRET_KEY: ci-only-long-random-secret-key-value-0123456789abcdef
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5182,http://127.0.0.1:8012
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements/lock.txt
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the real Worker
        working-directory: backend
        run: |
          mkdir -p ../var/logs
          nohup .venv/bin/celery -A config worker --pool=solo \
            -Q ingestion,tutoring,projection -c 1 -l INFO \
            > ../var/logs/original-worker.log 2>&1 &
          echo $! > ../var/logs/original-worker.pid
          for _ in $(seq 1 30); do
            if grep -q "ready" ../var/logs/original-worker.log 2>/dev/null; then break; fi
            sleep 1
          done
          tail -5 ../var/logs/original-worker.log
      - name: Browser suite (original 16)
        working-directory: frontend
        run: npx playwright test
      - name: Worker log
        if: always()
        run: tail -50 var/logs/original-worker.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-original-report
          path: var/browser-e2e
