# AcePass CI: the checks that must pass before a change is considered done.
#
# PostgreSQL is a real service here: the consistency and constraint tests must
# never fall back to SQLite. The browser job runs the Playwright suite against a
# real API and a real browser; a green API run does not replace it.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acepass
          POSTGRES_USER: acepass
          POSTGRES_PASSWORD: acepass_dev_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acepass" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      ACEPASS_RUNTIME_MODE: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: acepass
      POSTGRES_USER: acepass
      POSTGRES_PASSWORD: acepass_dev_pw
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements/lock.txt -r requirements/dev.txt
      - name: Lint
        working-directory: backend
        run: .venv/bin/ruff check apps ai domain config tests
      - name: Django checks (dev and production)
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-long-random-secret-key-value-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.dev .venv/bin/python manage.py check
          DJANGO_SETTINGS_MODULE=config.settings.prod .venv/bin/python manage.py check --deploy || true
      - name: Tests (real PostgreSQL)
        working-directory: backend
        run: .venv/bin/python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and build
        working-directory: frontend
        run: |
          npx tsc -b
          npx vite build

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acepass
          POSTGRES_USER: acepass
          POSTGRES_PASSWORD: acepass_dev_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acepass" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: acepass
      POSTGRES_USER: acepass
      POSTGRES_PASSWORD: acepass_dev_pw
      ACEPASS_PRIVATE_MEDIA_ROOT: ${{ github.workspace }}/var/private-media
      DJANGO_SECRET_KEY: ci-only-long-random-secret-key-value-0123456789abcdef
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements/lock.txt
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser acceptance
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
