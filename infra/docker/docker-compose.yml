# AcePass Compose 编排（P0）。
#
# TLS 终止方案：唯一终止点是 web(nginx) 服务。80 只做 301 跳转，443 终止 TLS，
# 证书来自 ACEPASS_TLS_DIR（默认 ./certs，需含 tls.crt/tls.key）；到 api 的一段是
# 私网明文 HTTP，由代理显式声明 X-Forwarded-Proto: https。Django 侧
# (backend/config/settings/prod.py) 使用同一份契约：信任该代理头、保持
# SECURE_SSL_REDIRECT 开启、对 /health/* 的明文探针豁免跳转、Cookie 仅 HTTPS。
# 自签名证书可先用 scripts/gen-dev-certs.sh 生成（仅本机验证）。
#
# 首次部署前请按 infra/docker/README.md 逐条验证，尤其是健康检查、持久化卷与备份恢复。

name: acepass

x-backend-image: &backend-image
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
  image: acepass-backend:${ACEPASS_IMAGE_TAG:-p0}

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  ACEPASS_RUNTIME_MODE: production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set DJANGO_CSRF_TRUSTED_ORIGINS in .env}
  # TLS 契约（见文件头）：公共方案始终 HTTPS，内部探针走明文 HTTP 且被豁免跳转。
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-false}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-2592000}
  POSTGRES_DB: ${POSTGRES_DB:-acepass}
  POSTGRES_USER: ${POSTGRES_USER:-acepass}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CACHE_URL: redis://redis:6379/2
  ACEPASS_PRIVATE_MEDIA_ROOT: /data/private-media
  ACEPASS_STORAGE_BACKEND: local
  # AI 未配置时产品仍可完整使用（手动录题、作答、判分、复习）。
  ACEPASS_AI_PROVIDER: ${ACEPASS_AI_PROVIDER:-none}
  ACEPASS_AI_BASE_URL: ${ACEPASS_AI_BASE_URL:-}
  ACEPASS_AI_API_KEY: ${ACEPASS_AI_API_KEY:-}
  ACEPASS_AI_TEXT_MODEL: ${ACEPASS_AI_TEXT_MODEL:-}
  ACEPASS_AI_VISION_MODEL: ${ACEPASS_AI_VISION_MODEL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acepass}
      POSTGRES_USER: ${POSTGRES_USER:-acepass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acepass} -d ${POSTGRES_DB:-acepass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [private]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis 承载 Celery 队列与缓存：必须持久化，队列内容在重启后仍可恢复
    # （AOF everysec + 每小时/千次写入的 RDB 快照），数据落在 redis-data 卷。
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [private]
    restart: unless-stopped

  api:
    <<: *backend-image
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]
    environment:
      <<: *backend-env
    volumes:
      - private-media:/data/private-media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # 明文 HTTP + 回环 Host：/health/ready 已豁免 HTTPS 跳转（prod.py
    # SECURE_REDIRECT_EXEMPT），探针结果只取决于 API 自身与数据库依赖，
    # 与公共 TLS 方案无关。回环主机名在 ALLOWED_HOSTS 中（prod.py）。
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [private]
    restart: unless-stopped

  worker-ingestion:
    <<: *backend-image
    command: ["celery", "-A", "config", "worker", "-Q", "ingestion", "-c", "2", "-l", "INFO"]
    environment:
      <<: *backend-env
    volumes:
      - private-media:/data/private-media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  worker-tutoring:
    <<: *backend-image
    command: ["celery", "-A", "config", "worker", "-Q", "tutoring", "-c", "2", "-l", "INFO"]
    environment:
      <<: *backend-env
    volumes:
      - private-media:/data/private-media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  worker-projection:
    <<: *backend-image
    command: ["celery", "-A", "config", "worker", "-Q", "projection", "-c", "2", "-l", "INFO"]
    environment:
      <<: *backend-env
    volumes:
      - private-media:/data/private-media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  scheduler:
    <<: *backend-image
    command: ["celery", "-A", "config", "beat", "-l", "INFO"]
    environment:
      <<: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    environment:
      # 明文入口 301 的目标端口。nginx 官方镜像的入口脚本会把
      # /etc/nginx/templates/*.template 中的 ${ACEPASS_HTTPS_PORT} 替换成本值，
      # 所以跳转始终指向实际公开的 HTTPS 端口，而不是容器内的 443。
      ACEPASS_HTTPS_PORT: ${ACEPASS_HTTPS_PORT:-8443}
    volumes:
      - ../proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
      # TLS 证书：tls.crt / tls.key；默认 ./certs，可用 ACEPASS_TLS_DIR 覆盖。
      - ${ACEPASS_TLS_DIR:-./certs}:/etc/nginx/certs:ro
      # 可选：ACME HTTP-01 挑战文件目录（证书轮换用）。
      - certbot-webroot:/var/www/certbot
    ports:
      - "${ACEPASS_HTTP_PORT:-8080}:80"
      - "${ACEPASS_HTTPS_PORT:-8443}:443"
    # nginx 没有 curl/wget 的 TLS 校验开关（busybox wget 会拒绝自签名证书），
    # 因此这里确认两个监听端口都已在接受连接；API 的可用性由 api 的
    # healthcheck 与 depends_on 保证。
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 && nc -z 127.0.0.1 80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

volumes:
  postgres-data:
  private-media:
  redis-data:
  certbot-webroot:

networks:
  private:
    driver: bridge
