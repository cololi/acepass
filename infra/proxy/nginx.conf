# 同源反向代理：SPA 与 /api 由同一来源提供，避免跨域并让 Session/CSRF 正常工作。
#
# 未在真实目标机器上验证。上线前请确认：HTTPS 证书、上传大小限制与超时时间
# 与实际使用相符（大题可能同时上传多张图片）。
upstream acepass_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # 安全响应头；启用 HTTPS 后请一并打开 HSTS。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://acepass_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;   # 附件下载走流式，不落磁盘缓冲
    }

    location = /health/live { proxy_pass http://acepass_api; }
    location = /health/ready { proxy_pass http://acepass_api; }

    # 私有文件由 API 鉴权后下发；这里不暴露媒体目录。
    location /static/ {
        alias /usr/share/nginx/html/;
        access_log off;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
